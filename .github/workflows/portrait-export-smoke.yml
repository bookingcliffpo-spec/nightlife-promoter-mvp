name: One-Time Portrait Export Smoke Test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/portrait-export-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for production deployment
        run: sleep 90
      - name: Verify site is reachable
        run: |
          for i in {1..10}; do
            if curl -fsS --max-time 20 https://nightlife-promoter-mvp.vercel.app/ >/dev/null; then
              exit 0
            fi
            sleep 15
          done
          exit 1
      - name: Verify 3:4 1080p export route
        run: |
          SOURCE="https://huggingface.co/spaces/mindmime/gradio/resolve/main/demo/video_component/files/world.mp4"
          curl -fL --max-time 30 "$SOURCE" -o /tmp/source.mp4
          test -s /tmp/source.mp4

          RESPONSE=$(curl -fsS --max-time 300 \
            -X POST https://nightlife-promoter-mvp.vercel.app/api/upscale-video \
            -H 'Content-Type: application/json' \
            --data '{"source_url":"https://huggingface.co/spaces/mindmime/gradio/resolve/main/demo/video_component/files/world.mp4","aspect_ratio":"3:4","quality":"1080p"}')

          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"ok":true'
          echo "$RESPONSE" | grep -q '"width":1080'
          echo "$RESPONSE" | grep -q '"height":1440'

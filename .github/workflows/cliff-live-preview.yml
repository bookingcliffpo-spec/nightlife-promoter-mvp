name: Cliff Free Cinematic Studio Build

on:
  pull_request:
    paths:
      - "frontend/**"
      - "free-wangp/**"
      - ".github/workflows/cliff-live-preview.yml"
  push:
    branches:
      - main
      - free-video-studio
      - wangp-free-local
      - free-cinematic-suite
    paths:
      - "frontend/**"
      - "free-wangp/**"
      - ".github/workflows/cliff-live-preview.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check WanGP plugin syntax
        run: python -m py_compile free-wangp/wan2gp-cliff-studio/plugin.py
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
